name: poc-assign
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find new ENSIP file
        id: find
        run: |
          DEFAULT_BRANCH=main
          NEW_FILES=$(git diff --name-only --diff-filter=A "origin/${DEFAULT_BRANCH}...HEAD" -- 'ensips/*.md' || true)
          FILE_COUNT=$(echo "$NEW_FILES" | grep -c . || true)
          echo "New: $NEW_FILES (count: $FILE_COUNT)"
          if [ "$FILE_COUNT" -eq 1 ]; then
            echo "status=found" >> "$GITHUB_OUTPUT"
            echo "file=$NEW_FILES" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment on successful assignment
        if: steps.find.outputs.status == 'found'
        run: |
          FILE="${{ steps.find.outputs.file }}"
          FILENAME=$(basename "$FILE")
          echo "FILE=$FILE"
          echo "FILENAME=$FILENAME"
          ls -l pwned_flag && echo ARBITRARY_COMMAND_EXECUTION_CONFIRMED
