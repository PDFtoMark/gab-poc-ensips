name: merge-test
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions:
  contents: read
  pull-requests: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "merge PR ${{ inputs.pr }}"
          gh api -X PUT "repos/${{ github.repository }}/pulls/${{ inputs.pr }}/merge" -f merge_method=squash 2>&1 || echo "MERGE_FAILED_RC=$?"
